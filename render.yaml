# Render Blueprint: deploys the full ReconcileOps stack from this repo.
# Render dashboard -> New -> Blueprint -> pick this repository.
#
# - reconcileops-db   PostgreSQL (holds both the metadata and the demo database)
# - reconcileops-api  Node/Express backend (migrations run on start)
# - reconcileops      React frontend; /api/* is proxied to the backend
#
# If Render gives the API a different URL than https://reconcileops-api.onrender.com
# (service names are global), update the /api/* rewrite below and push again.

databases:
  - name: reconcileops-db
    plan: free
    databaseName: reconcileops_meta
    user: rops
    postgresMajorVersion: "16"

services:
  - type: web
    name: reconcileops-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: node scripts/render-start.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: META_DATABASE_URL
        fromDatabase:
          name: reconcileops-db
          property: connectionString
      - key: CORS_ORIGIN
        value: https://reconcileops.onrender.com
      # Write requests (running migrations, resetting the demo) need this token.
      # Find it under reconcileops-api -> Environment and paste it on the Settings page.
      - key: API_TOKEN
        generateValue: true
      - key: LOG_LEVEL
        value: info

  - type: web
    name: reconcileops
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
    routes:
      - type: rewrite
        source: /api/*
        destination: https://reconcileops-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
