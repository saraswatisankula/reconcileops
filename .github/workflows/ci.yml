name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      meta:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rops_meta_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      demo:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rops_demo_test
        ports: ["5433:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TEST_META_DATABASE_URL: postgres://postgres:postgres@localhost:5432/rops_meta_test
      TEST_DEMO_DATABASE_URL: postgres://postgres:postgres@localhost:5433/rops_demo_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Apply metadata migrations with Flyway
        run: |
          docker run --rm --network host -v "$PWD/db/migrations:/flyway/sql:ro" flyway/flyway:10-alpine \
            -url=jdbc:postgresql://localhost:5432/rops_meta_test -user=postgres -password=postgres migrate
      - run: npm run test:unit
      - run: npm run test:integration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up -d --build
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/api/health && break
            sleep 3
          done
          curl -sf http://localhost:8080/api/health
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Playwright
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8080
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: e2e/test-results
